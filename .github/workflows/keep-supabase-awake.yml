name: Keep Supabase awake

# Supabase pauses free projects after a week without activity. Margin's health check reads from
# the database, so calling it every three days keeps the project running. If it fails (the project
# was paused, or the site is down), GitHub emails you. For your own deployment, set the SITE_URL
# repository variable. In a public repository, GitHub turns scheduled workflows off after 60 days
# without commits; turn it back on from the Actions tab.
on:
  schedule:
    - cron: "23 4 */3 * *" # 04:23 UTC on days 1, 4, 7, ... of each month
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the site and its database
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://margin.dhanpulse.in' }}
        run: curl -fsS --retry 3 --retry-all-errors --retry-delay 20 "$SITE_URL/api/health"
